services:
  - type: web
    name: portfolio-llm-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz

    envVars:
      - key: ENVIRONMENT
        value: production

      - key: GATEWAY_JWT_SECRET
        sync: false

      - key: GATEWAY_ENCRYPTION_KEY
        sync: false

      - key: UPSTASH_REDIS_REST_URL
        sync: false

      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: WORKSPACE_IDENTITY_SECRET
        sync: false